name: banking_mobile_workspace
description: Pub workspace for the customer app, the field officer app and their shared packages.
publish_to: none

environment:
  sdk: ^3.13.0

# One lockfile and one resolution for every member, so all apps build against the same dependency versions.
workspace:
  - packages/banking_api
  - packages/banking_core
  - packages/banking_ui
  - customer_app
  - field_officer_app
dev_dependencies:
  flutter_lints: ^6.0.0

# The field app's offline queue is an encrypted SQLite database: package:sqlite3 bundles SQLite3MultipleCiphers
# (prebuilt for every platform, checked against the sha256 sums published with the package) instead of plain SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
