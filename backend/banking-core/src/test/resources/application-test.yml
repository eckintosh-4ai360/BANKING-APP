banking:
  eod:
    async: false
  scheduling:
    enabled: false
  crypto:
    active-key-version: 1
    data-keys:
      1: BVOxNmlXHutcXPq9VPpsu97iDGWPvjp6GCFAdnrmrwM=
    blind-index-key: ACtTDQ1zY8e+jYoxRHFUOd4MVP7IIIBM+9shtcgHaDc=
  # One-second seals with no lag, so tests can seal what they just wrote (sealing only runs when a test calls it).
  audit:
    seal:
      active-key-version: 1
      keys:
        1: MW2Iz7lJP0DfwbNND8KV6wgowJ3LR+SIgnZOSP0nT64=
      period: PT1S
      lag: PT0S
      max-per-run: 100000
  kyc:
    identity-verification-provider: stub
  storage:
    base-path: ${java.io.tmpdir}/banking-test-documents
  security:
    jwt:
      allow-ephemeral-keys: true
    mfa:
      platform-required: false
    # Cheap hashing keeps the suite fast; deployed environments enforce the OWASP minimum.
    password-hashing:
      memory-kib: 1024
      iterations: 1
      parallelism: 1
    rate-limit:
      store: in-memory
      login-per-ip:
        limit: 100000
        window: PT1M
      login-per-account:
        limit: 100000
        window: PT1M

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.company.banking: INFO
    org.hibernate.SQL: WARN
