# Local development (docker compose). Development-only defaults; never deploy this profile.
spring:
  datasource:
    password: ${DB_APP_PASSWORD:banking_app_local}
  flyway:
    password: ${DB_MIGRATOR_PASSWORD:banking_migrator_local}
  data:
    redis:
      password: ${REDIS_PASSWORD:banking_redis_local}

banking:
  # LOCAL DEVELOPMENT KEYS ONLY. Published in the repository, therefore worthless for protecting real data;
  # deployed environments refuse to start with them.
  crypto:
    active-key-version: 1
    data-keys:
      1: bN9YtA/MrxiGo85v+XFsh9dIl9SEyvMbkA+lTekXVT8=
    blind-index-key: Ing4I/mBG69mjiX86y9NBzQU8XvLiRHTu8hWM/nr6U4=
  audit:
    seal:
      keys:
        1: U+Y9NROLhm0a8O19L9xty26psAg5AIHHazP5V1frC7U=
  kyc:
    identity-verification-provider: stub
  # Texts are kept in memory and readable at GET /api/v1/public/dev/sms?phoneNumber=... (local only).
  notification:
    sms:
      provider: stub
      stub-inbox-enabled: true
    push:
      provider: stub
  channel:
    pin-pepper: CaK7tzupRMuSVBxZIhyjJAkD1vVAGI+pYirI/tUYpao=
    otp-pepper: haQ04s7+udwnxake6Nc79QO7FNxxmy7xbm5dtV3b40M=
  security:
    jwt:
      # Ephemeral keys: tokens are invalidated on restart.
      allow-ephemeral-keys: true
    mfa:
      # Lets the demo platform owner sign in without an authenticator. Mandatory everywhere else.
      platform-required: false
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

logging:
  level:
    com.company.banking: DEBUG
