# Local development stack.
#   docker compose up -d                  # PostgreSQL + Redis (run the API from your IDE or ./mvnw)
#   docker compose --profile app up -d    # ... plus the banking-core API in a container
# Values come from .env (copy .env.example). Ports bind to localhost only.
name: banking-platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      BANKING_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
      BANKING_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d banking"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  banking-core:
    profiles: ["app"]
    build:
      context: ./backend/banking-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOCUMENT_STORAGE_PATH: /app/data/documents
    volumes:
      - document-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  document-data:
